name: pvmemcontrol guest memory protection validation

on:
  push:
    branches:
      - pvmemcontrol-vmm-memory-protection-validation
    paths:
      - ".github/workflows/pvmemcontrol-vmm-memory-protection-validation.yml"
      - "tests/pvmemcontrol-mprotect-vmm-fault.patch"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
      UPSTREAM_REVISION: 038ce5a72d761380a02f714a4eb4ca63e0ea073d

    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Fetch exact Cloud Hypervisor v54.0 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/cloud-hypervisor/cloud-hypervisor.git upstream
          git -C upstream checkout --detach "$UPSTREAM_REVISION"
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_REVISION"
          mkdir -p artifacts
          {
            echo "upstream_revision=$(git -C upstream rev-parse HEAD)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "runner=$(uname -a)"
            git -C upstream show -s --format=fuller HEAD
          } | tee artifacts/environment.txt

      - name: Run devices baseline tests
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          timeout 600s cargo test --locked -p devices --features pvmemcontrol --lib -- --test-threads=1 2>&1 | tee ../artifacts/devices-baseline.log

      - name: Apply isolated guest-to-VMM reproduction
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          git apply --check ../tests/pvmemcontrol-mprotect-vmm-fault.patch
          git apply ../tests/pvmemcontrol-mprotect-vmm-fault.patch
          git diff --check
          git diff --stat | tee ../artifacts/patch-stat.txt
          git diff --name-only | tee ../artifacts/changed-files.txt
          if git diff --name-only | grep -v '^devices/src/pvmemcontrol.rs$'; then
            echo "Unexpected file modification"
            exit 1
          fi

      - name: Run isolated pvmemcontrol reproduction
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s cargo test --locked -p devices --features pvmemcontrol pvmemcontrol_security_tests::guest_mprotect_none_can_fault_the_vmm_guest_memory_mapping -- --nocapture 2>&1 | tee ../artifacts/pvmemcontrol-repro.log

      - name: Run complete devices tests with reproduction
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          timeout 600s cargo test --locked -p devices --features pvmemcontrol --lib -- --test-threads=1 2>&1 | tee ../artifacts/devices-with-repro.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvmemcontrol-vmm-memory-protection-validation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
